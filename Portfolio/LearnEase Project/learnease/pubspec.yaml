name: task_manager_new
description: "A Flutter task management application with AI-powered sorting"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.7.2 <4.0.0'
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  path_provider: ^2.0.11
  intl: ^0.19.0           # Updated to match flutter_localizations pin
  flutter_dotenv: ^5.1.0
  http: ^1.2.0
  url_launcher: ^6.1.11
  table_calendar: ^3.0.9
  flutter_local_notifications: ^19.1.0
  timezone: ^0.10.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.4.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.6

flutter:
  uses-material-design: true
  generate: true
  assets:
    - .env  # Only keep this if you're using .env file